telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}

auth:
  jwt-secret: ${AUTH_JWT_SECRET:change-me-please-change-me-please-change-me}
  access-token-ttl-seconds: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:3600}
  refresh-token-ttl-seconds: ${AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: ${OPENAI_MODEL:gpt-5-mini}

spring:
  sql:
    init:
      mode: never

  datasource:
    url: jdbc:postgresql://localhost:5432/practico
    username: postgres
    password: postgres
  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas: core
    default-schema: core
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: core
    show-sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui