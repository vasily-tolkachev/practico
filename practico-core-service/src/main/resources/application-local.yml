spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/practico}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true

server:
  port: ${SERVER_PORT:8080}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:}

openai:
  api-key: ${OPENAI_API_KEY:}
