spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/practico}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    show-sql: true

auth:
  providers:
    google:
      enabled: ${AUTH_PROVIDERS_GOOGLE_ENABLED:true}
      client-id: ${AUTH_PROVIDERS_GOOGLE_CLIENT_ID:}
