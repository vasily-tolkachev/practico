services:
  postgres:
    image: postgres:17-alpine
    container_name: practico-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: practico
      POSTGRES_USER: practico
      POSTGRES_PASSWORD: practico
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - practico-net

  auth:
    build:
      context: .
      dockerfile: practico-auth-service/Dockerfile
    container_name: practico-auth
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/practico
      DB_USERNAME: practico
      DB_PASSWORD: practico
      AUTH_JWT_KEY_ID: practico-auth-k1
      AUTH_JWT_ACCESS_TOKEN_TTL_SECONDS: 3600
      AUTH_PROVIDERS_GOOGLE_ENABLED: "true"
      AUTH_PROVIDERS_GOOGLE_CLIENT_ID: ${AUTH_PROVIDERS_GOOGLE_CLIENT_ID}
    networks:
      - practico-net

  core:
    build:
      context: .
      dockerfile: practico-core-service/Dockerfile
    container_name: practico-core
    restart: unless-stopped
    depends_on:
      - postgres
      - auth
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/practico
      DB_USERNAME: practico
      DB_PASSWORD: practico
      AUTH_JWKS_URI: http://auth:8081/.well-known/jwks.json
      TELEGRAM_ENABLED: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    networks:
      - practico-net

  frontend:
    build:
      context: ../mastery-web
      dockerfile: ../practico/docker/frontend/Dockerfile
    container_name: practico-frontend
    restart: unless-stopped
    environment:
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-/api}
      PUBLIC_AUTH_BASE_URL: ${PUBLIC_AUTH_BASE_URL:-/api/auth}
    networks:
      - practico-net

  nginx:
    image: nginx:1.27-alpine
    container_name: practico-nginx
    restart: unless-stopped
    depends_on:
      - core
      - auth
      - frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/certs:/etc/nginx/certs:ro
    networks:
      - practico-net

volumes:
  postgres_data:

networks:
  practico-net:
